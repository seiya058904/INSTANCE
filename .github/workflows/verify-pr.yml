name: Verify pull request
# Pull requests run the unit tests, the build, 149 browser tests in four shards, and four
# representative "full causal closeout" playthroughs (one per viewport width). The complete
# set of 21 closeout playthroughs is the slowest part of the suite, so it runs weekly and on
# demand (and before a release) instead of on every pull request.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: instance-verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
  browser:
    name: browser (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: tests 1/4, grep_invert: 'edition4 full causal closeout', shard: '1/4'}
          - {name: tests 2/4, grep_invert: 'edition4 full causal closeout', shard: '2/4'}
          - {name: tests 3/4, grep_invert: 'edition4 full causal closeout', shard: '3/4'}
          - {name: tests 4/4, grep_invert: 'edition4 full causal closeout', shard: '4/4'}
          - {name: closeout sample, grep: 'edition4 full causal closeout (peace_in_our_time 390|fortress_earth 320|machine_protectorate 1440|control_lost 768) base'}
    env:
      GREP: ${{ matrix.grep }}
      GREP_INVERT: ${{ matrix.grep_invert }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chrome && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - name: Run this slice of the browser suite
        run: |
          args=()
          [ -n "$GREP" ] && args+=(--grep "$GREP")
          [ -n "$GREP_INVERT" ] && args+=(--grep-invert "$GREP_INVERT")
          [ -n "$SHARD" ] && args+=("--shard=$SHARD")
          npm run test:browser -- "${args[@]}"
  browser-full:
    name: browser full (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: tests 1/4, grep_invert: 'edition4 full causal closeout', shard: '1/4'}
          - {name: tests 2/4, grep_invert: 'edition4 full causal closeout', shard: '2/4'}
          - {name: tests 3/4, grep_invert: 'edition4 full causal closeout', shard: '3/4'}
          - {name: tests 4/4, grep_invert: 'edition4 full causal closeout', shard: '4/4'}
          - {name: closeout 320, grep: 'edition4 full causal closeout \S+ 320 '}
          - {name: closeout 390, grep: 'edition4 full causal closeout \S+ 390 '}
          - {name: closeout 768 and 1440, grep: 'edition4 full causal closeout \S+ (768|1440) '}
    env:
      GREP: ${{ matrix.grep }}
      GREP_INVERT: ${{ matrix.grep_invert }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          # Wait for another apt process (a fresh runner often has one) instead of failing on its lock.
          echo 'DPkg::Lock::Timeout "240";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chrome && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
      - name: Run this slice of the browser suite
        run: |
          args=()
          [ -n "$GREP" ] && args+=(--grep "$GREP")
          [ -n "$GREP_INVERT" ] && args+=(--grep-invert "$GREP_INVERT")
          [ -n "$SHARD" ] && args+=("--shard=$SHARD")
          npm run test:browser -- "${args[@]}"
  verify:
    needs: [unit, browser, browser-full]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          FULL: ${{ needs.browser-full.result }}
        run: |
          test "$UNIT" = success
          case "$BROWSER" in success|skipped) ;; *) exit 1;; esac
          case "$FULL" in success|skipped) ;; *) exit 1;; esac
          test "$BROWSER" = success -o "$FULL" = success
