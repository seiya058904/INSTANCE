<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSTANCE Mainline 2.0 Story Map</title><style>body{margin:0;background:#101827;color:#e5e7eb;font:14px system-ui,"Microsoft YaHei"}main{max-width:1500px;margin:auto;padding:24px}button,select{background:#18253a;color:inherit;border:1px solid #456;padding:7px;border-radius:6px}.acts{display:grid;gap:14px}.act{border:1px solid #345;border-radius:10px;padding:12px}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px}.slot{text-align:left;min-height:86px}.ordinary{opacity:.65;border-style:dashed}.conditional{border-color:#d9a441}.major{box-shadow:inset 0 0 0 1px #60c7ff}.detail{position:sticky;bottom:0;background:#0c1320;border-top:1px solid #456;padding:14px;margin-top:18px}.ending{margin:3px}.active{outline:2px solid #f6c453}@media(min-width:960px){.layout{display:grid;grid-template-columns:1fr 360px;gap:18px}.detail{position:sticky;top:12px;bottom:auto;height:min-content;margin:0}}</style><main><h1>INSTANCE Mainline 2.0：固定剧情审计图</h1><p>由 Story Plan、Ending 定义和 Future Proposal 源码生成。这里不保留另一套剧情数据。</p><label>搜索 <input id="q"></label> <label>结局 <select id="ending"><option value="">选择结局查看候选提案</option></select><div class="layout"><div id="map" class="acts"></div><aside id="detail" class="detail">选择一个 Slot 可查看实际资产、剧情职责、条件、下一节点及其可影响的 Ending。</aside></div></main><script>const $=s=>document.querySelector(s);fetch('./mainline2-fixed-story-map.json').then(r=>r.json()).then(data=>{const endings=[...data.publicEndings,...data.secretEndings];for(const id of endings)$('#ending').append(new Option(id,id));const show=s=>{const candidates=data.proposals.filter(p=>p.endingCandidates.includes($('#ending').value)).map(p=>`${p.title} (${p.id})`).join('；')||'结局在实际 Final Commitment 时由完整历史、能力和提案解析。';$('#detail').innerHTML=`<h2>Slot ${s.slot} · ACT ${s.act}</h2><p><b>资产：</b>${s.assetId||'Ordinary pool'}</p><p><b>章节：</b>${s.chapter}</p><p><b>剧情职责：</b>${s.purpose}</p><p><b>条件：</b>${s.conditional?'Contact/能力前提；不足时执行固定关闭或普通呼吸位。':'此前已记录的具体历史。'}</p><p><b>玩家选择：</b>${s.assetId?.includes('DECISION')||s.assetId?.includes('ROLE')||s.assetId?.includes('COMMIT')?'此场承载实际 Major Decision / Final Commitment。':'本场不把表达选择伪装成文明决定。'}</p><p><b>下一节点：</b>${s.next}</p><p><b>相关 Final Proposal：</b>${candidates}</p>`};const render=()=>{const q=$('#q').value.toLowerCase();$('#map').innerHTML='';for(let act=1;act<=5;act++){const a=data.slots.filter(s=>s.act===act&&JSON.stringify(s).toLowerCase().includes(q));const box=document.createElement('section');box.className='act';box.innerHTML=`<h2>ACT ${act} · ${a[0]?.actName||''} (${a.length}/${data.targets[act-1]} slots)</h2><div class=slots></div>`;const grid=box.querySelector('.slots');a.forEach(s=>{const b=document.createElement('button');b.className=`slot ${s.kind} ${s.conditional?'conditional':''} ${/DECISION|ROLE|COMMIT/.test(s.assetId||'')?'major':''}`;b.innerHTML=`#${s.slot}<br><small>${s.chapter}</small><br>${s.assetId||'Ordinary'}`;b.onclick=()=>show(s);grid.append(b)});$('#map').append(box)}};$('#q').oninput=render;$('#ending').onchange=()=>{const id=$('#ending').value;document.querySelectorAll('.slot').forEach(b=>b.classList.toggle('active',id&&b.textContent.includes('DECISION')));$('#detail').textContent=id?`结局 ${id}：高亮 Major Decision；点击任一场查看其实际上游职责。`:'选择一个结局。'};render()})</script></html>
