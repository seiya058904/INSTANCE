<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSTANCE Mainline 2.0 Story Map</title><style>body{margin:0;background:#101827;color:#e5e7eb;font:14px system-ui,"Microsoft YaHei"}main{max-width:1500px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:1fr 440px;gap:18px}.act{border:1px solid #345;border-radius:10px;padding:12px;margin:12px 0}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}button,select{background:#18253a;color:inherit;border:1px solid #456;padding:7px;border-radius:6px}.slot{text-align:left;min-height:72px}.ordinary{opacity:.55;border-style:dashed}.active{outline:3px solid #f6c453}.detail{position:sticky;top:12px;height:calc(100vh - 48px);overflow:auto;border:1px solid #345;padding:14px;border-radius:10px}.trace{border-left:2px solid #60c7ff;margin:8px 0;padding:7px}.mut{color:#a5f3fc}@media(max-width:900px){.layout{display:block}.detail{position:static;height:auto}}</style><main><h1>INSTANCE Mainline 2.0：真实路线审计图</h1><p>路线由 clean legal Runtime trace 生成；没有按 Ending 名称猜测的路径。</p><label>Ending <select id="ending"><option value="">选择 Ending</option></select></label><div class="layout"><section id="map"></section><aside id="detail" class="detail">选择 Ending 或节点。</aside></div></main><script>const $=s=>document.querySelector(s);Promise.all(['mainline2-fixed-story-map.json','mainline2-route-traces.json'].map(x=>fetch('./'+x).then(r=>r.json()))).then(([map,traces])=>{const routes=[...traces.publicRoutes,...traces.secretRoutes],slotButtons=new Map;for(const r of routes)$('#ending').append(new Option(r.secretEndingId||r.endingId,r.secretEndingId||r.endingId));function showSlot(s){const through=routes.filter(r=>r.steps.some(x=>x.slot===s.slot)).map(r=>r.secretEndingId||r.endingId);$('#detail').innerHTML=`<h2>Slot ${s.slot} · ACT ${s.act}</h2><p><b>sourceRef：</b>${s.assetId||'Ordinary pool'}</p><p><b>为什么此时出现：</b>${s.purpose}</p><p><b>下一步：</b>${s.next}</p><p><b>实际经过本节点的 Ending：</b>${through.join('、')||'无'}</p>`}for(let act=1;act<=5;act++){const box=document.createElement('section');box.className='act';box.innerHTML=`<h2>ACT ${act}（${map.targets[act-1]} Slot）</h2><div class=slots></div>`;const grid=box.querySelector('.slots');map.slots.filter(s=>s.act===act).forEach(s=>{const b=document.createElement('button');b.className='slot '+s.kind;b.textContent=`#${s.slot} ${s.assetId||'Ordinary'}`;b.onclick=()=>showSlot(s);slotButtons.set(s.slot,b);grid.append(b)});$('#map').append(box)}$('#ending').onchange=()=>{const id=$('#ending').value,r=routes.find(x=>(x.secretEndingId||x.endingId)===id);slotButtons.forEach(b=>b.classList.remove('active'));if(!r){$('#detail').textContent='选择 Ending。';return}r.steps.filter(s=>s.slot).forEach(s=>slotButtons.get(s.slot)?.classList.add('active'));$('#detail').innerHTML=`<h2>${id}</h2><p>提案：${r.proposalId}；实际解析：${r.resolvedEnding}${r.secretEndingId?'；隐藏触发：'+r.secretEndingId+' / '+r.overlayMode:''}</p>${r.steps.map((s,i)=>`<article class=trace><b>${i+1}. Slot ${s.slot??'桥接'} · ${s.title||s.sourceRef}</b><br>${s.userMessage||''}<br><b>选择：</b>${s.choiceText}<br><span class=mut>${s.decisionId?`${s.decisionId}=${s.canonicalValue}`:''} ${(s.mutations||[]).map(m=>m.type+(m.flagId?':'+m.flagId:m.event?':'+m.event:'')).join('；')}</span></article>`).join('')}`}})</script></html>
