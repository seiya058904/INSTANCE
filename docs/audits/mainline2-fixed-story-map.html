<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INSTANCE Mainline 2.0 Story Map</title>
  <style>
    :root{color-scheme:dark;font:14px system-ui,"Microsoft YaHei"}body{margin:0;background:#101827;color:#e5e7eb}main{max-width:1680px;margin:auto;padding:24px}button,select{background:#18253a;color:inherit;border:1px solid #456;padding:7px;border-radius:6px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0}.toolbar label{display:grid;gap:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,36%);gap:18px}.act{border:1px solid #345;border-radius:10px;padding:12px;margin:12px 0}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}.slot{text-align:left;min-height:78px}.slot small{display:block;color:#a5f3fc;margin-top:4px}.ordinary{opacity:.72;border-style:dashed}.active{outline:3px solid #f6c453}.detail{position:sticky;top:12px;height:calc(100vh - 48px);overflow:auto;border:1px solid #345;padding:14px;border-radius:10px}.trace,.choice,.divergence,.node-detail{border-left:2px solid #60c7ff;margin:8px 0;padding:8px}.choice{border-left-color:#9ee6b1}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparison{border:1px solid #345;border-radius:10px;padding:14px;margin:18px 0}summary{cursor:pointer}p{line-height:1.55;overflow-wrap:anywhere}@media(max-width:980px){.layout{display:block}.detail{position:static;height:auto}.compare-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <h1>INSTANCE Mainline 2.0：真实路线 Story Map</h1>
    <p>36 条路线全部来自 clean legal <code>runMainline2Route</code>。Ending 高亮、节点详情和比较均使用实际 Runtime trace，不按 Ending 名称或 Major Decision 标签猜测。</p>
    <section class="toolbar" aria-label="路线与比较控制">
      <label>查看 Ending<select id="ending"><option value="">选择 Ending</option></select></label>
      <label>比较路线 A<select id="compare-left"></select></label>
      <label>比较路线 B<select id="compare-right"></select></label>
      <button id="compare" type="button">比较实际选择</button>
    </section>
    <section id="comparison" class="comparison">选择两条路线可查看共同历史、第一次与之后的实际选择分歧，以及 Ending 分歧。</section>
    <div class="layout">
      <section id="map" aria-label="198 Slot Story Map"></section>
      <aside id="detail" class="detail">选择 Ending 或节点。</aside>
    </div>
  </main>
  <script type="module">
    import { mountStoryMap } from '../../tools/mainline2-story-map-ui.mjs'
    mountStoryMap().catch((error) => { document.querySelector('#detail').textContent = `Story Map 加载失败：${error.message}` })
  </script>
</body>
</html>
